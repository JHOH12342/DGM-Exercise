name: ddpm
T: 1000
beta_schedule: linear  # linear | cosine
beta_start: 1.0e-4
beta_end: 0.02
sampler: ancestral  # ancestral | ddim
sample_steps: 1000
lr: 1.0e-3
clip_grad: 1.0
net:
  mlp:  {hidden: 256, n_layers: 4, time_dim: 128}
  unet: {ch: 64, ch_mult: [1, 2, 2, 2], num_res_blocks: 2, attn_resolutions: [16], dropout: 0.1}
