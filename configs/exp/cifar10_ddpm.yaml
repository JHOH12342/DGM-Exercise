defaults:
  data: cifar10
  model: ddpm
train:
  steps: 300000
  batch_size: 128
  log_every: 100
  eval_every: 10000
  ckpt_every: 20000
  ema: {enabled: true, decay: 0.9999, start_step: 1000}
model:
  lr: 2.0e-4
  net:
    unet: {ch: 128, ch_mult: [1, 2, 2, 2], num_res_blocks: 2, attn_resolutions: [16], dropout: 0.1}
eval:
  n_samples: 10000
  sample_batch_size: 500
  fid: {enabled: true, n_ref: 10000, feature: 2048}
viz:
  trajectory_max: 16
